                font-medium
                text-[#777777]
              "
            >
              계정 메뉴
            </div>


            <!-- 내 정보 -->
            <button
              type="button"
              data-open-my-info
              class="
                flex h-11 w-full
                items-center gap-3
                text-left
                text-base
                text-[#E7E7E7]

                hover:text-white
              "
            >
              <i
                data-lucide="user-round"
                class="
                  h-5 w-5 shrink-0
                  text-[#ADADAD]
                "
              ></i>

              <span>내 정보</span>
            </button>


            <!-- 로그아웃 -->
            <button
              type="button"
              class="
                flex h-11 w-full
                items-center gap-3
                text-left
                text-base
                text-[#E7E7E7]

                hover:text-white
              "
            >
              <i
                data-lucide="log-out"
                class="
                  h-5 w-5 shrink-0
                  text-[#ADADAD]
                "
              ></i>

              <span>로그아웃</span>
            </button>

          </div>

        </div>

        </div>

      </div>

    </header>


      
<main class="information-main" id="informationMain">
  <!-- 모바일 배경 -->
  <div class="information-overlay" id="informationOverlay" hidden></div>

  <!-- 모바일 검색 필터 배경 -->
      <div
        id="vesselDbFilterOverlay"
        class="vessel-db-filter-overlay"
        hidden
      ></div>

      <!-- 모바일 검색 필터 열기 버튼 -->
      <button
        type="button"
        id="vesselDbFilterToggle"
        class="vessel-db-filter-toggle"
        aria-label="검색 필터 열기"
        aria-controls="vesselDbFilter"
        aria-expanded="false"
      >
        <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
        <span>검색 필터</span>
      </button>

  <!-- 좌측 검색 옵션 -->
  <aside class="information-filter" id="informationFilter" aria-label="정보현황 검색 옵션">
    <div class="information-filter-header">
      <h2>검색 옵션</h2>
    </div>

    <form id="informationSearchForm" class="information-filter-form">
      <div class="information-filter-fields">
        <div class="information-field">
          <label for="informationSearch">검색 (선박명 · MMSI · 제목)</label>
          <input type="search" id="informationSearch"
                 placeholder="검색어 입력" autocomplete="off">
        </div>

        <fieldset class="information-fieldset">
          <legend>상태</legend>
          <div class="information-chip-group" data-filter-group="status">
            <button type="button" class="information-chip is-selected" aria-pressed="true">신규</button>
            <button type="button" class="information-chip is-selected" aria-pressed="true">진행</button>
            <button type="button" class="information-chip" aria-pressed="false">종결</button>
          </div>
        </fieldset>

        <fieldset class="information-fieldset">
          <legend>종류</legend>
          <div class="information-chip-group" data-filter-group="type">
            <button type="button" class="information-chip is-selected" aria-pressed="true">전체</button>
            <button type="button" class="information-chip" aria-pressed="false">즉각대응 지시</button>
            <button type="button" class="information-chip" aria-pressed="false">경로 추천</button>
            <button type="button" class="information-chip" aria-pressed="false">위험선박 전달</button>
            <button type="button" class="information-chip" aria-pressed="false">다함정 순찰 배정</button>
          </div>
        </fieldset>

        <fieldset class="information-fieldset">
          <legend>등급</legend>
          <div class="information-chip-group" data-filter-group="grade">
            <button type="button" class="information-chip is-selected" aria-pressed="true">전체</button>
            <button type="button" class="information-chip" aria-pressed="false">심각</button>
            <button type="button" class="information-chip" aria-pressed="false">경계</button>
            <button type="button" class="information-chip" aria-pressed="false">주의</button>
          </div>
        </fieldset>

        <fieldset class="information-fieldset">
          <legend>기간(수신)</legend>
          <div class="information-chip-group" data-filter-group="period">
            <button type="button" class="information-chip is-selected" aria-pressed="true">24시간</button>
            <button type="button" class="information-chip" aria-pressed="false">3일</button>
            <button type="button" class="information-chip" aria-pressed="false">7일</button>
          </div>
        </fieldset>
      </div>

      <div class="information-filter-actions">
        <button type="submit" class="information-action information-action-primary">
          <i data-lucide="search" aria-hidden="true"></i> 검색
        </button>
        <button type="reset" class="information-action">
          <i data-lucide="rotate-ccw" aria-hidden="true"></i> 초기화
        </button>
      </div>
    </form>
  </aside>

  <!-- 우측 콘텐츠 -->
  <section class="information-content" aria-label="정보현황 목록">
    <div class="information-tabs" role="tablist" aria-label="정보현황 메뉴">
      <button type="button" id="informationTabStatus"
              class="information-tab is-active"
              role="tab" aria-selected="true"
              aria-controls="informationPanelStatus">
        정보 현황
      </button>
      <button type="button" id="informationTabHistory"
              class="information-tab"
              role="tab" aria-selected="false"
              aria-controls="informationPanelHistory" tabindex="-1">
        조치 이력
      </button>
    </div>

    <div id="informationPanelStatus" role="tabpanel"
         aria-labelledby="informationTabStatus">
      <div class="information-toolbar">
        <div class="information-counts">
          <span class="information-count">
            <span class="information-status-dot"></span>
            연결됨 <strong>KCG-HQ</strong>
          </span>
          <span class="information-count">대기열 <strong>0</strong></span>
          <label class="information-search-switch">
            <span>상태 검색 켜짐</span>
            <input type="checkbox" id="informationAutoSearch" checked>
            <span class="information-switch-track" aria-hidden="true"></span>
          </label>
        </div>

        <div class="information-table-options">
          <span>미종결 <strong>0</strong> · 종결 <strong>0</strong></span>
          <label for="informationPageSize" class="information-sr-only">페이지당 표시 개수</label>
          <select id="informationPageSize">
            <option value="10">10개씩</option>
            <option value="20">20개씩</option>
            <option value="50">50개씩</option>
          </select>
        </div>
      </div>

      <div class="information-table-scroll">
        <table class="information-table">
          <thead>
            <tr>
              <th scope="col">시각</th>
              <th scope="col">정보</th>
              <th scope="col">상태</th>
              <th scope="col">조작</th>
            </tr>
          </thead>
          <tbody id="informationTableBody">
            <tr>
              <td colspan="4" class="information-empty">
                조건에 맞는 정보가 없습니다.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="informationPanelHistory" role="tabpanel"
         aria-labelledby="informationTabHistory" hidden>
      <div class="information-history-empty">
        조치 이력이 없습니다.
      </div>
    </div>
  </section>
</main>


  </div>


<!-- Lucide -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.lucide) {
      lucide.createIcons();
    }
  });
</script>

  <!-- Common JS -->
  <script src="./js/ship-common.js" defer></script>

</body>
</html>
