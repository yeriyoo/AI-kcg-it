<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI-HUB - 신청 장바구니</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Pretendard -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  />

  <!-- Common CSS -->
  <link
    rel="stylesheet"
    href="./css/hub-common.css"
  />
  <link rel="icon" type="image/png" href="./img/hub-favicon.png">
</head>


<body
  class="
    linked-data-page
    min-w-[1280px]
    bg-white
    font-['Pretendard']
    text-[#142A4D]
  "
>

  <div class="min-h-screen">


    <!-- =====================================================
        TOP NAVIGATION
    ====================================================== -->
    <header
      class="
        header-shell
        fixed
        left-0 top-0 right-0
        z-50
        flex h-[60px] shrink-0
        items-center
        border-b border-[#476187]
        px-8
      "
    >

  <!-- =====================================================
       LOGO
  ====================================================== -->
  <h1
    class="
      mr-20
      flex shrink-0
      items-center gap-2
      text-[24px] font-semibold
      text-white
    "
  >
    <span
      class="
        flex h-8 w-8
        items-center justify-center
        rounded-full
      "
    >
      <img
      src="./img/logo.svg"
      alt="AI-HUB"
      class="
        h-8 w-8
        shrink-0
        object-contain
      "
    />

    </span>

    AI-HUB
  </h1>


  <!-- =====================================================
       MAIN MENU
  ====================================================== -->
  <nav
    id="mainHeaderNav"
    class="flex h-full items-center gap-10"
    aria-label="주요 메뉴"
  >


    <button
      type="button"
      class="
        flex h-full items-center gap-2
        px-2
        text-lg font-semibold
        text-white
        hover:text-white
      "
    >
      <i
        data-lucide="scroll-text"
        class="h-6 w-6"
      ></i>

      데이터 목록
    </button>


    <button
      type="button"
      class="
        flex h-full items-center gap-2
        px-2
        text-lg font-semibold
        text-white
        hover:text-white
      "
    >
      <i
        data-lucide="workflow"
        class="h-6 w-6"
      ></i>

      연계 데이터
    </button>


    <button
      type="button"
      class="
        flex h-full items-center gap-2
        px-2
        text-lg font-semibold
        text-white
        hover:text-white
      "
    >
      <i
        data-lucide="file-pen"
        class="h-6 w-6"
      ></i>

      데이터 제공신청
    </button>


    <button
      type="button"
      class="
        relative
        flex h-full items-center gap-2
        px-2
        text-lg font-semibold
        text-white
      "
    >
      <i
        data-lucide="book-bookmark"
        class="h-6 w-6"
      ></i>

      데이터 출처
    </button>


    <button
      type="button"
      class="
        relative
        flex h-full items-center gap-2
        px-2
        text-lg font-semibold
        text-white
      "
    >
      <i
        data-lucide="file-cog"
        class="h-6 w-6"
      ></i>

      표준화
    </button>

  </nav>



  <!-- =====================================================
       HEADER UTILITY
  ====================================================== -->
  <div class="ml-auto shrink-0">


    <!-- =================================================
         DESKTOP / 1651px 이상
    ================================================== -->
    <div
      id="headerUtilityDesktop"
      class="flex items-center gap-3"
    >

      <!-- Time -->
      <span
        class="
          whitespace-nowrap
          text-lg font-medium
          text-white
        "
      >
        11:43:50 KST
      </span>


      <div class="h-5 w-px bg-[#476187]"></div>


      <!-- Download -->
      <button
        type="button"
        class="
          flex h-8 w-8
          items-center justify-center
          text-white
          hover:text-white
        "
        aria-label="다운로드"
      >
        <i
          data-lucide="download"
          class="h-5 w-5"
        ></i>
      </button>


      <!-- App -->
      <button
        type="button"
        class="
          flex h-8 w-8
          items-center justify-center
          text-white
          hover:text-white
        "
        aria-label="메뉴"
      >
        <i
          data-lucide="grid-3x3"
          class="h-5 w-5"
        ></i>
      </button>


      <!-- Print -->
      <button
        type="button"
        class="
          flex h-8 w-8
          items-center justify-center
          text-white
          hover:text-white
        "
        aria-label="인쇄"
      >
        <i
          data-lucide="printer"
          class="h-5 w-5"
        ></i>
      </button>


      <!-- Notification -->
      <button
        type="button"
        class="
          relative
          flex h-8 w-8
          items-center justify-center
          text-white
          hover:text-white
        "
        aria-label="알림"
      >
        <i
          data-lucide="shopping-cart"
          class="h-5 w-5"
        ></i>

        <span
          class="
            absolute right-0 top-0
            flex h-[16px] min-w-[16px]
            items-center justify-center
            rounded-full
            bg-[#F84141]
            px-1
            text-[10px] font-semibold
            leading-none
            text-white
          "
        >
          2
        </span>
      </button>

      <!-- Notification -->
      <button
        type="button"
        class="
          flex h-8 w-8
          items-center justify-center
          text-white
          hover:text-white
        "
        aria-label="알림"
      >
        <i
          data-lucide="bell"
          class="h-5 w-5"
        ></i>
      </button>


      <!-- Theme -->
      <button
        type="button"
        class="
          flex h-8 w-8
          items-center justify-center
          text-white
          hover:text-white
        "
        aria-label="화면 모드"
      >
        <i
          data-lucide="moon"
          class="h-5 w-5"
        ></i>
      </button>


      <div class="h-5 w-px bg-[#476187]"></div>


      <!-- User -->
      <button
        id="userMenuToggle"
        type="button"
        aria-expanded="false"
        aria-controls="userMenu"
        class="
          flex items-center gap-2
          text-[#E7F7FF]
          hover:text-white
        "
      >
        <span
          class="
            flex h-7 w-7
            items-center justify-center
            rounded-full
            bg-[#476187]
            text-base font-semibold
            text-white
          "
        >
          여
        </span>

        <span class="whitespace-nowrap text-base">
          여한상 (경위)
        </span>
      </button>

    </div>

    <!-- =================================================
        COMPACT / 1650px 이하
    ================================================== -->
    <div
      id="headerUtilityCompact"
      class="relative hidden"
    >

      <button
        id="headerUtilityToggle"
        type="button"
        aria-expanded="false"
        aria-controls="userMenu"
        aria-label="계정 메뉴"
        class="
          flex h-10 w-10
          items-center justify-center
          rounded
          text-white
          hover:bg-[#476187]
          hover:text-white
        "
      >
        <i
          data-lucide="menu"
          class="h-6 w-6"
        ></i>
      </button>

    </div>
  </div>
</header>

    <!-- =====================================================
     USER MENU
     1650px 이하 / 260 x 372
    ====================================================== -->
    <div
      id="userMenu"
      class="
        fixed right-[28px] top-[50px]
        z-[300]
        hidden
        h-[400px] w-[260px]
        overflow-hidden
        rounded
        border border-[#476187]
        bg-[#142A4D]
        shadow-2xl
      "
    >

    <!-- 1440px 이하 주요 메뉴 이동 영역 -->
    <nav
      id="mobileMainNav"
      aria-label="모바일 주요 메뉴"
      class="hidden"
    ></nav>

      <!-- CURRENT TIME -->
      <div
        class="
          flex h-[64px]
          flex-col justify-center
          border-b border-[#476187]
          px-4
        "
      >
        <span
          class="
            text-base
            text-[#99ABC6]
          "
        >
          현재 시각
        </span>

        <strong
          id="accountCurrentTime"
          class="
            mt-1
            text-base
            font-medium
            text-white
          "
        >
          2026-10-06 15:48:55
        </strong>
      </div>


      <!-- TIMEZONE -->
      <div
        class="
          flex h-[48px]
          items-center justify-between
          border-b border-[#476187]
          px-4
        "
      >
        <span class="text-base text-[#99ABC6]">
          시간대
        </span>

        <div
          class="
            flex h-7
            overflow-hidden
            rounded
            bg-[#476187]
          "
        >
          <button
            id="timezoneKst"
            type="button"
            data-timezone="Asia/Seoul"
            class="
              timezone-button active
              flex min-w-[44px]
              items-center justify-center
              bg-white
              px-3
              text-base font-semibold
              text-[#142A4D]
            "
          >
            KST
          </button>

          <button
            id="timezoneUtc"
            type="button"
            data-timezone="UTC"
            class="
              timezone-button
              flex min-w-[44px]
              items-center justify-center
              bg-[#476187]
              px-3
              text-base font-semibold
              text-[#CBD6EA]
            "
          >
            UTC
          </button>
        </div>
      </div>


      <!-- TOOLS -->
      <div
        class="
          grid
          grid-cols-3
          border-b border-[#476187]
        "
      >
        <button
          type="button"
          class="
            flex flex-col h-14
            items-center justify-center
            gap-1
            border-r border-[#476187]
            text-[#CBD6EA]
            hover:bg-[#0046AD]
            hover:text-white
          "
        >
          <i
            data-lucide="download"
            class="h-5 w-5"
          ></i>

          <span class="text-sm">
            다운로드
          </span>
        </button>


        <button
          type="button"
          class="
            flex flex-col h-14
            items-center justify-center
            gap-1
            border-r border-[#476187]
            text-[#CBD6EA]
            hover:bg-[#0046AD]
            hover:text-white
          "
        >
          <i
            data-lucide="grid-3x3"
            class="h-5 w-5"
          ></i>

          <span class="text-sm">
            엑셀
          </span>
        </button>


        <button
          type="button"
          class="
            flex flex-col h-14
            items-center justify-center
            gap-1
            text-[#CBD6EA]
            hover:bg-[#0046AD]
            hover:text-white
          "
        >
          <i
            data-lucide="printer"
            class="h-5 w-5"
          ></i>

          <span class="text-sm">
            인쇄
          </span>
        </button>

         <button
          type="button"
          class="
            flex flex-col h-14
            items-center justify-center
            gap-1
            border-r border-[#476187]
            border-t border-[#476187
            text-[#CBD6EA]
            hover:bg-[#0046AD]
            hover:text-white
          "
        >
          <span class="relative">
            <i
              data-lucide="shopping-cart"
              class="h-5 w-5"
            ></i>

            <span
              class="
                absolute -right-2 -top-2
                flex h-4 min-w-4
                items-center justify-center
                rounded-full
                bg-[#F84141]
                px-1
                text-[10px] font-semibold
                leading-none text-white
              "
            >
              2
            </span>
          </span>

          <span class="text-sm">
            신청 장바구니
          </span>
        </button>


        <button
          type="button"
          class="
            flex flex-col h-14
            items-center justify-center
            gap-1
            border-r border-[#476187]
            border-t border-[#476187
            text-[#CBD6EA]
            hover:bg-[#0046AD]
            hover:text-white
          "
        >
          <i
            data-lucide="bell"
            class="h-5 w-5"
          ></i>

          <span class="text-sm">
            알림
          </span>
        </button>


        <button
          type="button"
          class="
            flex flex-col h-14
            items-center justify-center
            gap-1
            border-r border-[#476187]
            border-t border-[#476187
            text-[#CBD6EA]
            hover:bg-[#0046AD]
            hover:text-white
          "
        >
          <i
            data-lucide="moon"
            class="h-5 w-5"
          ></i>

          <span class="text-sm">
            다크모드
          </span>
        </button>
      </div>


      <!-- ACCOUNT -->
      <div
        class="
          flex h-[52px]
          items-center gap-3
          border-b border-[#476187]
          px-4
        "
      >
        <span
          class="
            flex h-8 w-8
            shrink-0
            items-center justify-center
            rounded-full
            bg-[#476187]
            text-base font-semibold
            text-white
          "
        >
          여
        </span>

        <strong
          class="
            truncate
            text-base
            font-semibold
            text-white
          "
        >
          여한상 (경위)
        </strong>
      </div>


      <!-- ACCOUNT MENU -->
      <div
        class="
          h-[100px]
          px-3 py-2
        "
      >
    
        <button
          type="button"
          class="
            flex h-11 w-full
            items-center gap-3
            rounded
            px-2
            text-left
            text-base
            text-white
            hover:bg-[#0046AD]
          "
        >
          <i
            data-lucide="user-round"
            class="h-5 w-5 text-[#CBD6EA]"
          ></i>

          <span>내 정보</span>
        </button>


        <button
          type="button"
          class="
            flex h-11 w-full
            items-center gap-3
            rounded
            px-2
            text-left
            text-base
            text-white
            hover:bg-[#0046AD]
          "
        >
          <i
            data-lucide="log-out"
            class="h-5 w-5 text-[#CBD6EA]"
          ></i>

          <span>로그아웃</span>
        </button>
      </div>

    </div>

    <!-- =====================================================
        MAIN
    ====================================================== -->
    <main
      class="
        min-h-screen
        bg-[#F3F6FD]
        pt-[60px]
      "
    >

      <!-- =====================================================
          PAGE INTRO
      ====================================================== -->
      <section class="bg-white">
        <div
          class="
            mx-auto
            flex h-[80px]
            w-full max-w-[1200px]
            items-center
            gap-3
            px-4
          "
        >
          <i
            data-lucide="shopping-cart"
            class="h-6 w-6 shrink-0 text-black"
          ></i>

          <h2
            class="
              shrink-0
              text-lg
              font-semibold
              text-black
            "
          >
            신청 장바구니
          </h2>

          <p
            class="
              text-base
              font-medium
              text-[#476187]
            "
          >
            목록에서 담은 데이터를 유형별로 모아 한 번에 신청합니다.
          </p>
        </div>
      </section>


      <!-- =====================================================
          CART CONTENT
      ====================================================== -->
      <section
        class="
          mx-auto
          w-full max-w-[1200px]
          px-4
          pb-20
          pt-10
        "
      >


        <!-- =================================================
            OPEN API 사용신청
        ================================================== -->
        <div
          class="
            border-t-[3px]
            border-[#476187]
            bg-white
            px-5
            pb-7
            pt-5
          "
        >

          <!-- TITLE / ACTION -->
          <div
            class="
              flex
              items-start
              justify-between
              gap-6
            "
          >

            <div>
              <h3
                class="
                  text-[22px]
                  font-semibold
                  leading-tight
                  text-black
                "
              >
                OPEN API 사용신청 (1)
              </h3>

              <p
                class="
                  mt-3
                  text-base
                  font-medium
                  text-[#476187]
                "
              >
                담은 API가 신청 모델에 자동 선택됩니다.
                필요 시 조정해 일괄 신청하세요(1건의 키로 발급).
              </p>
            </div>


            <button
              type="button"
              class="
                inline-flex
                h-[42px]
                shrink-0
                items-center
                justify-center
                whitespace-nowrap
                rounded
                bg-[#0061F0]
                px-5
                text-base
                font-semibold
                text-white
                hover:bg-[#0055D2]
              "
            >
              OPEN API 일괄 신청 (1건)
            </button>

          </div>


          <!-- API ITEM -->
          <div
            class="
              mt-6
              flex min-h-[48px]
              items-center
              justify-between
              rounded
              border border-[#CDD6E8]
              bg-white
              px-4
            "
          >

            <strong
              class="
                min-w-0
                truncate
                text-base
                font-semibold
                text-black
              "
            >
              선박운항지수 분류 목록
            </strong>


            <button
              type="button"
              aria-label="선박운항지수 분류 목록 삭제"
              class="
                flex h-9 w-9
                shrink-0
                items-center
                justify-center
                rounded
                text-black
              "
            >
              <i
                data-lucide="x"
                class="h-5 w-5"
              ></i>
            </button>

          </div>

        </div>



        <!-- =================================================
            데이터셋 다운로드 신청
        ================================================== -->
        <div
          class="
            mt-6
            border-t-[3px]
            border-[#476187]
            bg-white
            px-5
            pb-7
            pt-5
          "
        >

          <!-- TITLE / ACTION -->
          <div
            class="
              flex
              items-start
              justify-between
              gap-6
            "
          >

            <div>
              <h3
                class="
                  text-[22px]
                  font-semibold
                  leading-tight
                  text-black
                "
              >
                데이터셋 다운로드 신청 (1)
              </h3>

              <p
                class="
                  mt-3
                  text-base
                  font-medium
                  text-[#476187]
                "
              >
                공통 신청 정보(목적·기간·동의)로 담은 데이터셋을 한 번에 신청합니다.
                결과는 건별로 표시됩니다.
              </p>
            </div>


            <button
              type="button"
              class="
                inline-flex
                h-[42px]
                shrink-0
                items-center
                justify-center
                whitespace-nowrap
                rounded
                bg-[#0061F0]
                px-5
                text-base
                font-semibold
                text-white
                hover:bg-[#0055D2]
              "
            >
              OPEN API 일괄 신청 (1건)
            </button>

          </div>


          <!-- DATASET ITEM -->
          <div
            class="
              mt-6
              flex min-h-[48px]
              items-center
              justify-between
              rounded
              border border-[#CDD6E8]
              bg-white
              px-4
            "
          >

            <strong
              class="
                min-w-0
                truncate
                text-base
                font-semibold
                text-black
              "
            >
              특정금지수역 — 국립해양조사원
            </strong>


            <button
              type="button"
              aria-label="특정금지수역 삭제"
              class="
                flex h-9 w-9
                shrink-0
                items-center
                justify-center
                rounded
                text-black
              "
            >
              <i
                data-lucide="x"
                class="h-5 w-5"
              ></i>
            </button>

          </div>

        </div>

      </section>

    </main>

  
    <!-- =====================================================
         CHATBOT FLOATING BUTTON
    ====================================================== -->
    <button
      class="
    fixed bottom-6 right-6
    z-50
    h-14 w-14
    rounded-full
    bg-transparent
    shadow-none
  "
>
      <img
    src="./img/chat-bot.png"
    alt="AI 챗봇"
    class="
      block
      h-full w-full
      rounded-full
      object-cover
      mix-blend-multiply
      drop-shadow-[5px_7px_6px_rgba(20,42,77,0.25)]
    "
  />
    </button>

  </div>



  <!-- Lucide -->
  <script>
    lucide.createIcons();
  </script>

  <!-- Common JS -->
  <script src="./js/hub-common.js"></script>

</body>
</html>
