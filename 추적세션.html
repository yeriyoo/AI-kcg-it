              class="
                mb-2
                text-sm
                font-medium
                text-[#777777]
              "
            >
              계정 메뉴
            </div>


            <!-- 내 정보 -->
            <button
              type="button"
              data-open-my-info
              class="
                flex h-11 w-full
                items-center gap-3
                text-left
                text-base
                text-[#E7E7E7]

                hover:text-white
              "
            >
              <i
                data-lucide="user-round"
                class="
                  h-5 w-5 shrink-0
                  text-[#ADADAD]
                "
              ></i>

              <span>내 정보</span>
            </button>


            <!-- 로그아웃 -->
            <button
              type="button"
              class="
                flex h-11 w-full
                items-center gap-3
                text-left
                text-base
                text-[#E7E7E7]

                hover:text-white
              "
            >
              <i
                data-lucide="log-out"
                class="
                  h-5 w-5 shrink-0
                  text-[#ADADAD]
                "
              ></i>

              <span>로그아웃</span>
            </button>

          </div>

        </div>

        </div>

      </div>

    </header>


   
<!-- =========================================
     SeaOn - 추적세션 본문
========================================= -->

<main class="tracking-main">

  <!-- 모바일 필터 배경 -->
  <div
    id="trackingOverlay"
    class="tracking-overlay"
    hidden
  ></div>

  <!-- =====================================
       좌측 검색 필터
  ====================================== -->
  <aside
    id="trackingFilter"
    class="tracking-filter"
    aria-label="추적세션 검색 필터"
  >

    <!-- 모바일 필터 헤더 -->
    <div class="tracking-filter-heading">
      <strong class="tracking-mobile-heading">
        검색 필터
      </strong>

      <button
        type="button"
        id="trackingFilterClose"
        class="tracking-filter-close"
        aria-label="검색 필터 닫기"
      >
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
    </div>

    <form
      id="trackingFilterForm"
      class="tracking-filter-form"
    >

      <div class="tracking-filter-fields">

        <!-- 상태 -->
        <fieldset class="tracking-fieldset">
          <legend>상태</legend>

          <div
            class="tracking-chip-group"
            data-tracking-group="status"
          >
            <button
              type="button"
              class="tracking-chip is-selected"
              data-value="all"
              aria-pressed="true"
            >
              전체
            </button>

            <button
              type="button"
              class="tracking-chip"
              data-value="tracking"
              aria-pressed="false"
            >
              추적 중
            </button>

            <button
              type="button"
              class="tracking-chip"
              data-value="closed"
              aria-pressed="false"
            >
              종료
            </button>

            <button
              type="button"
              class="tracking-chip"
              data-value="sealed"
              aria-pressed="false"
            >
              봉인
            </button>
          </div>
        </fieldset>

        <!-- 검색 -->
        <div class="tracking-field">
          <label for="trackingSearch">
            검색
          </label>

          <input
            type="search"
            id="trackingSearch"
            name="keyword"
            placeholder="세션번호 · 선명 · MMSI · 타겟 ID"
            autocomplete="off"
          >
        </div>

        <!-- 개설 기간 -->
        <fieldset class="tracking-fieldset">
          <legend>개설 기간</legend>

          <div
            class="tracking-chip-group"
            data-tracking-group="period"
          >
            <button
              type="button"
              class="tracking-chip"
              data-value="24h"
              aria-pressed="false"
            >
              24시간
            </button>

            <button
              type="button"
              class="tracking-chip"
              data-value="7d"
              aria-pressed="false"
            >
              7일
            </button>

            <button
              type="button"
              class="tracking-chip"
              data-value="30d"
              aria-pressed="false"
            >
              30일
            </button>

            <button
              type="button"
              class="tracking-chip is-selected"
              data-value="all"
              aria-pressed="true"
            >
              전체
            </button>
          </div>
        </fieldset>

      </div>

      <!-- 하단 검색 / 초기화 -->
      <div class="tracking-filter-actions">

        <button
          type="submit"
          class="tracking-action tracking-action-primary"
        >
          <i data-lucide="search" aria-hidden="true"></i>
          <span>검색</span>
        </button>

        <button
          type="button"
          id="trackingReset"
          class="tracking-action"
        >
          <i data-lucide="rotate-ccw" aria-hidden="true"></i>
          <span>초기화</span>
        </button>

      </div>

    </form>
  </aside>

  <!-- =====================================
       우측 콘텐츠
  ====================================== -->
  <section
    class="tracking-content"
    aria-label="추적세션 목록"
  >

    <!-- 모바일 필터 열기 -->
    <button
      type="button"
      id="trackingFilterToggle"
      class="tracking-filter-toggle"
      aria-expanded="false"
      aria-controls="trackingFilter"
    >
      <i
        data-lucide="sliders-horizontal"
        aria-hidden="true"
      ></i>
      <span>검색 필터</span>
    </button>

    <!-- 탭 -->
    <div class="tracking-tabs">
      <span class="tracking-tab-active">
        추적 세션
      </span>
    </div>

    <!-- =================================
         현황 및 표시 개수
    ================================== -->
    <div class="tracking-toolbar">

      <!-- 상태별 개수 -->
      <div class="tracking-counts">

        <span class="tracking-count tracking-count-green">
          추적 중
          <strong id="trackingActiveCount">0</strong>
        </span>

        <span class="tracking-count">
          종료
          <strong id="trackingClosedCount">0</strong>
        </span>

        <span class="tracking-count tracking-count-yellow">
          봉인
          <strong id="trackingSealedCount">0</strong>
        </span>

      </div>

      <!-- 우측 표시 옵션 -->
      <div class="tracking-table-options">

        <span id="trackingUpdated">
          갱신 12:22
        </span>

        <label
          for="trackingPageSize"
          class="tracking-sr-only"
        >
          페이지당 표시 개수
        </label>

        <select id="trackingPageSize">
          <option value="10" selected>10개씩</option>
          <option value="20">20개씩</option>
          <option value="50">50개씩</option>
        </select>

      </div>
    </div>

    <!-- =================================
         추적세션 테이블
    ================================== -->
    <div
      class="tracking-table-scroll"
      tabindex="0"
      role="region"
      aria-label="추적세션 테이블, 가로 스크롤 가능"
    >

      <table class="tracking-table">

        <thead>
          <tr>
            <th scope="col">세션번호</th>
            <th scope="col">대상</th>
            <th scope="col">사유</th>
            <th scope="col">상태</th>
            <th scope="col">상황실</th>
            <th scope="col">개설</th>
            <th scope="col">종료</th>
            <th scope="col">사건</th>
          </tr>
        </thead>

        <tbody id="trackingTableBody">

          <!-- 검색 결과가 없는 기본 화면 -->
          <tr>
            <td
              colspan="8"
              class="tracking-empty"
            >
              조건에 맞는 추적 세션이 없습니다.
            </td>
          </tr>

        </tbody>

      </table>
    </div>

    <!-- 페이지네이션 -->
    <div
      id="trackingPagination"
      class="tracking-pagination"
      hidden
    ></div>

  </section>

</main>


  </div>


  <!-- Lucide -->
  <script>
    lucide.createIcons();
  </script>

  <!-- Common JS -->
  <script src="./js/ship-common.js"></script>

</body>
</html>
